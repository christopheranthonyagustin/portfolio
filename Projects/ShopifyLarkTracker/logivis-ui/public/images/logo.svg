<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">

    <defs>
        <style>
            .node {
                fill: #2563EB;
            }

            .line {
                stroke: #2563EB;
                stroke-width:6;
                stroke-linecap:round;
            }
        </style>
    </defs>

    <!-- Connections -->

    <line class="line" x1="64" y1="24" x2="28" y2="52"></line>
    <line class="line" x1="64" y1="24" x2="100" y2="52"></line>
    <line class="line" x1="28" y1="52" x2="28" y2="96"></line>
    <line class="line" x1="100" y1="52" x2="100" y2="96"></line>
    <line class="line" x1="28" y1="96" x2="64" y2="112"></line>
    <line class="line" x1="100" y1="96" x2="64" y2="112"></line>

    <!-- Center -->

    <circle class="node" cx="64" cy="64" r="10"></circle>

    <!-- Outer Nodes -->

    <circle class="node" cx="64" cy="20" r="8"></circle>
    <circle class="node" cx="24" cy="52" r="8"></circle>
    <circle class="node" cx="104" cy="52" r="8"></circle>
    <circle class="node" cx="24" cy="100" r="8"></circle>
    <circle class="node" cx="104" cy="100" r="8"></circle>
    <circle class="node" cx="64" cy="116" r="8"></circle>

</svg>