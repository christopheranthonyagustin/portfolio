<main class="auth-callback-page">

  <section class="auth-callback-card">

    <div class="logo-container">
      <img src="/images/logo.svg"
           alt="LogiVis Logo"
           class="logo">
    </div>

    <div class="loading-indicator">
      <span></span>
    </div>

    <h1>
      {{ 'auth.signingIn' | translate }}
    </h1>

    <p class="message">
      {{ 'auth.signingInMessage' | translate }}
    </p>

    <div class="loading-dots"
         aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </div>

  </section>

</main>
