<header class="header">

  <div class="header-left">

    <h1>{{ title }}</h1>

    <p>{{ subtitle }}</p>

  </div>

  <div class="header-right">

    <div class="user-email">

      <span>{{ currentUser?.Email }}</span>

    </div>

    <button class="icon-button">
      🔔
    </button>



    <button class="logout-button"
            (click)="logout()">
      🚪 Logout
    </button>

  </div>

</header>
