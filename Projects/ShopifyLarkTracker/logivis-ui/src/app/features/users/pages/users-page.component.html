<div class="app-layout"
     [class.sidebar-collapsed]="sidebarService.collapsed()">

  <app-sidebar></app-sidebar>

  <div class="main-content">

    <app-header title="header.dashboard.title"
                subtitle="header.dashboard.subtitle">
    </app-header>

    <div class="content">

      <div class="page">

        <!-- Company Filter -->
        <!-- Page Toolbar -->
        <section class="page-toolbar">

          <div class="form-group">

            <label for="parentCompany">
              Parent Company
            </label>

            <select id="parentCompany"
                    [(ngModel)]="parentCompanyId"
                    (ngModelChange)="onParentCompanyChanged()"
                    [disabled]="!isSuperUser">

              <!-- Administrator -->
              <option *ngIf="!isSuperUser"
                      [ngValue]="currentUser?.CompanyId">
                {{ currentUser?.CompanyName }}
              </option>

              <!-- Super User -->
              <option *ngFor="let company of parentCompanies"
                      [ngValue]="company.CompanyId">
                {{ company.Name }}
              </option>

            </select>

          </div>

          <div class="form-group">

            <label for="company">
              Company
            </label>

            <select id="company"
                    [(ngModel)]="activeCompanyId"
                    (ngModelChange)="onCompanyChanged()">

              <option *ngFor="let company of companyOptions"
                      [ngValue]="company.CompanyId">
                {{ company.Name }}
              </option>

            </select>

          </div>

          <button class="primary-button"
                  (click)="inviteUser()">
            + Invite User
          </button>

        </section>

        <!-- Summary Cards -->
        <div class="summary-cards">

          <div class="summary-card pending">
            <div class="label">Pending Approval</div>
            <div class="value">{{ pendingApprovalCount }}</div>
          </div>

          <div class="summary-card active">
            <div class="label">Active</div>
            <div class="value">{{ activeCount }}</div>
          </div>

          <div class="summary-card inactive">
            <div class="label">Inactive</div>
            <div class="value">{{ inactiveCount }}</div>
          </div>

          <div class="summary-card total">
            <div class="label">Total Users</div>
            <div class="value">{{ totalUsers }}</div>
          </div>

        </div>

        <!-- Users Card -->
        <div class="users-card">

          <div class="table-header">

            <h2>Users</h2>

            <div class="table-actions">

              <input class="search-box"
                     type="text"
                     placeholder="Search users...">

              <button class="btn-secondary">
                Export
              </button>

            </div>

          </div>

          <div class="ag-theme-quartz grid-container">

            <ag-grid-angular class="dashboard-grid"
                             theme="legacy"
                             domLayout="autoHeight"
                             [columnDefs]="columnDefs"
                             [defaultColDef]="defaultColDef"
                             [rowData]="users"
                             [pagination]="true"
                             [paginationPageSize]="20"
                             (gridReady)="onGridReady($event)">
            </ag-grid-angular>

          </div>

        </div>

      </div>

    </div>

    <app-footer></app-footer>

  </div>

</div>
<app-user-edit-dialog></app-user-edit-dialog>
