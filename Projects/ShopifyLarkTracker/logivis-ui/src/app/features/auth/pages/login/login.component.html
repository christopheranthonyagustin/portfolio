<main class="login-page">

  <section class="login-card">

    <img src="/images/logo.svg"
         class="logo"
         alt="LogiVis Logo">

    <h1>LogiVis</h1>

    <p class="subtitle">
      {{ 'login.subtitle' | translate }}
    </p>

    <p class="description">
      {{ 'login.signIn' | translate }}
    </p>


    @if (showAlert) {

    <div class="login-alert"
         [class.warning]="authCode === 'PENDING'"
         [class.error]="authCode !== 'PENDING'">

      <div class="alert-header">

        <h3>{{ authTitle }}</h3>

        <button type="button"
                class="close-button"
                [attr.aria-label]="'login.close' | translate"
                (click)="closeAlert()">

          <i class="fa-solid fa-xmark"></i>

        </button>

      </div>

      <p>{{ authError }}</p>

    </div>

    }


    <!-- =====================================================
         Login Buttons
         ===================================================== -->

    <button type="button"
            class="login-button lark"
            (click)="loginWithLark()">

      <i class="fa-solid fa-feather-pointed provider-icon"></i>

      <span>
        {{ 'login.continueWithLark' | translate }}
      </span>

    </button>


    <button type="button"
            class="login-button google"
            (click)="loginWithGoogle()">

      <i class="fa-brands fa-google provider-icon"></i>

      <span>
        {{ 'login.continueWithGoogle' | translate }}
      </span>

    </button>


    <!-- =====================================================
         Language Switcher
         ===================================================== -->

    <div class="language-switcher">

      <span class="language-label">
        {{ 'login.language' | translate }}
      </span>

      <div class="language-toggle">

        <button type="button"
                [class.active]="language === 'en'"
                (click)="switchLanguage('en')">

          EN

        </button>

        <button type="button"
                [class.active]="language === 'zh'"
                (click)="switchLanguage('zh')">

          中文

        </button>

      </div>

    </div>


    <!-- =====================================================
         Footer
         ===================================================== -->

    <div class="footer">

      <div>
        {{ 'login.version' | translate }} {{ version }}
      </div>

      <div>
        © 2026 LogiVis
      </div>

    </div>

  </section>

</main>
